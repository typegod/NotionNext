  <style>
    :root { color-scheme: dark; --bg:#17252b; --text:#f5ede3; --soft:#d5d7d1; --accent:#eec193; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 74% 10%,#4f5651 0,#23353a 32%,var(--bg) 75%); color:var(--text); font:16px/1.6 system-ui,-apple-system,sans-serif; }
    main { width:min(1080px,calc(100% - 48px)); min-height:100vh; margin:auto; display:grid; grid-template-columns:minmax(280px,1fr) minmax(300px,.9fr); align-items:center; gap:clamp(32px,7vw,90px); padding:54px 0; }
    .cover { display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; box-shadow:0 32px 90px #0b171a9c; }
    .eyebrow { color:var(--accent); font-size:.78rem; letter-spacing:.19em; text-transform:uppercase; font-weight:650; }
    h1 { margin:16px 0 24px; font-weight:500; letter-spacing:-.055em; line-height:1.06; font-size:clamp(3rem,6vw,5.2rem); }
    p { max-width:29rem; color:var(--soft); font-size:1.08rem; }
    .details { display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--accent); font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; margin:32px 0 13px; }
    audio { display:block; width:100%; max-width:480px; height:50px; }
    @media(max-width:740px) { main { width:min(550px,calc(100% - 36px)); min-height:0; grid-template-columns:1fr; gap:36px; padding:24px 0 70px; } h1 { margin-top:10px; } }
  </style>

  <main>
    <img class="cover" src="/files/let-the-tide-in-v01/cover.png" alt="Shoes and a paper cup on a quiet beach at sunset">

      <h1>Let the<br>Tide In</h1>
      <p>Bare feet in warm sand. A cup of tea cooling in your hands. The tide comes in, the tide rolls out, and nothing needs solving tonight.</p>
      <div class="details"><span>English</span><span>·</span><span>Chill</span><span>·</span><span>3:30</span></div>
